<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌼 花田庫存 精華・花瓣管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --cream:#FFF6E8;
    --cream-deep:#FBE9CC;
    --leaf:#3E9166;
    --leaf-deep:#276148;
    --ink:#2B4636;
    --pink:#FF7FA8;
    --pink-deep:#E85D8D;
    --yellow:#FFC93C;
    --sky:#5FC1DE;
    --purple:#B080E0;
    --red:#FF6161;
    --red-deep:#D94A4A;
    --white:#FFFFFF;
    --card-shadow: 0 6px 0 rgba(39,97,72,0.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,201,60,0.18), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(255,127,168,0.16), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(95,193,222,0.15), transparent 40%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }

  .drift{
    position:fixed;
    pointer-events:none;
    z-index:0;
    opacity:0.55;
    animation: drift 9s ease-in-out infinite;
    font-size: clamp(22px, 3vw, 34px);
  }
  .drift.d1{ top:10%; left:4%; animation-delay:0s;}
  .drift.d2{ top:65%; left:2%; animation-delay:1.5s;}
  .drift.d3{ top:20%; right:5%; animation-delay:0.7s;}
  .drift.d4{ top:75%; right:6%; animation-delay:2.2s;}
  .drift.d5{ top:40%; left:1%; animation-delay:3s; font-size:20px;}
  @keyframes drift{
    0%,100%{ transform: translateY(0) rotate(-4deg);}
    50%{ transform: translateY(-22px) rotate(6deg);}
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1080px;
    margin:0 auto;
    padding: 28px 20px 80px;
  }

  .bloom-strip{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
    flex-wrap:wrap;
  }
  .bloom-strip span{
    display:inline-block;
    font-size: clamp(18px,2.4vw,26px);
    transform: scale(0);
    animation: bloom-pop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .bloom-strip span:nth-child(1){animation-delay:.05s;}
  .bloom-strip span:nth-child(2){animation-delay:.15s;}
  .bloom-strip span:nth-child(3){animation-delay:.25s;}
  .bloom-strip span:nth-child(4){animation-delay:.35s;}
  .bloom-strip span:nth-child(5){animation-delay:.45s;}
  .bloom-strip span:nth-child(6){animation-delay:.55s;}
  .bloom-strip span:nth-child(7){animation-delay:.65s;}
  @keyframes bloom-pop{
    0%{ transform: scale(0) rotate(-30deg); opacity:0;}
    70%{ transform: scale(1.25) rotate(8deg); opacity:1;}
    100%{ transform: scale(1) rotate(0deg); opacity:1;}
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }
  h1{
    font-family:"Baloo 2","Zen Maru Gothic",sans-serif;
    font-weight:800;
    font-size: clamp(26px, 5vw, 42px);
    margin: 4px 0 8px;
    color: var(--leaf-deep);
    letter-spacing: 1px;
    text-shadow: 3px 3px 0 var(--white), 3px 3px 0 var(--white);
  }
  header p.sub{
    font-size: clamp(13px, 1.8vw, 16px);
    color: #5C7B6A;
    margin:0;
    font-weight:500;
  }
  .status-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin: 14px auto 0;
  }
  .update-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--white);
    border: 2px dashed var(--leaf);
    color: var(--leaf-deep);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight:700;
  }
  .update-pill button{
    border:none;
    background: var(--leaf);
    color:#fff;
    font-family: inherit;
    font-weight:700;
    font-size:12px;
    padding:4px 12px;
    border-radius:999px;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .update-pill button:hover{ background: var(--leaf-deep); transform: translateY(-1px);}
  .update-pill button:active{ transform: translateY(1px) scale(.96);}

  .sync-pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight:700;
    background: #F5F3EE;
    color: #8A806E;
  }
  .sync-pill .dot{
    width:8px; height:8px; border-radius:50%;
    background:#B8AD94;
    flex-shrink:0;
  }
  .sync-pill.synced{ background:#EAF6EE; color:var(--leaf-deep); }
  .sync-pill.synced .dot{ background: var(--leaf); box-shadow:0 0 0 3px rgba(62,145,102,0.18); }
  .sync-pill.syncing{ background:#FFF6DE; color:#8A6A00; }
  .sync-pill.syncing .dot{ background: var(--yellow); animation: pulse-dot 1s ease-in-out infinite; }
  .sync-pill.error{ background:#FDEBEC; color:var(--red-deep); }
  .sync-pill.error .dot{ background: var(--red); }
  @keyframes pulse-dot{
    0%,100%{ opacity:1; transform:scale(1);}
    50%{ opacity:.4; transform:scale(0.7);}
  }

  .admin-pill{
    display:flex;
    width:fit-content;
    margin: 10px auto 0;
    align-items:center;
    gap:8px;
    background: var(--white);
    border: 2px dashed var(--purple);
    color: #6B4A9A;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight:700;
    flex-wrap:wrap;
    justify-content:center;
  }
  #googleSignInBtn{ line-height:0; }
  .admin-pill.is-admin{
    border-color: var(--leaf);
    color: var(--leaf-deep);
    background: #EAF6EE;
  }
  .admin-pill button{
    border:none;
    font-family: inherit;
    font-weight:700;
    font-size:12px;
    padding:4px 12px;
    border-radius:999px;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease;
    background: var(--purple);
    color:#fff;
  }
  .admin-pill.is-admin button{ background:#D8464E;}
  .admin-pill button:hover{ transform: translateY(-1px); filter:brightness(1.05);}
  .admin-pill button:active{ transform: translateY(1px) scale(.96);}

  .backend-hint{
    margin-top:8px;
    font-size:11.5px;
    color:#A6947A;
    text-align:center;
  }

  /* ---------- overview strip ---------- */
  .overview{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 22px 0 8px;
  }
  .overview-card{
    background: var(--white);
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: 0 4px 0 rgba(39,97,72,0.10);
    text-align:center;
  }
  .overview-card .tag{
    font-size:12px; font-weight:800; padding:2px 10px; border-radius:999px; display:inline-block; margin-bottom:6px;
  }
  .overview-card .nums{
    font-family:"Baloo 2",monospace;
    font-size:13px;
    font-weight:700;
    color:#5C7B6A;
    display:flex;
    justify-content:center;
    gap:10px;
  }

  /* ---------- section headings ---------- */
  .section-title{
    font-family:"Baloo 2",sans-serif;
    font-weight:700;
    font-size: 20px;
    color: var(--leaf-deep);
    display:flex;
    align-items:center;
    gap:8px;
    margin: 30px 0 16px;
  }
  .section-title .count-hint{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:12px;
    font-weight:700;
    color:#7C9686;
    background:#EFF7F1;
    padding:3px 10px;
    border-radius:999px;
  }

  /* ---------- filter / search / sort ---------- */
  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin: 18px 0 16px;
  }
  .chip{
    border: none;
    cursor:pointer;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:14px;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(43,70,54,0.15);
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  }
  .chip:hover{ transform: translateY(-2px);}
  .chip.active{
    background: var(--leaf);
    color:#fff;
    box-shadow: 0 3px 0 var(--leaf-deep);
  }

  .toolbar-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    align-items:center;
    margin-bottom: 24px;
  }
  .search-box input{
    width:100%;
    max-width:280px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:14px;
    font-weight:600;
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid #E3D9C4;
    outline:none;
    background: var(--white);
    color: var(--ink);
    text-align:center;
  }
  .search-box input:focus{ border-color: var(--leaf); }

  .sort-box select{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid #E3D9C4;
    outline:none;
    background: var(--white) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23276148'><path d='M5.5 7.5L10 12l4.5-4.5' stroke='%23276148' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 12px center;
    background-size: 14px;
    color: var(--leaf-deep);
    appearance:none;
    -webkit-appearance:none;
    padding-right: 34px;
    cursor:pointer;
  }
  .sort-box select:focus{ border-color: var(--leaf); }

  /* ---------- item cards ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card{
    background: var(--white);
    border-radius: 20px;
    padding: 14px 16px 14px;
    box-shadow: var(--card-shadow);
    border: 3px solid rgba(39,97,72,0.06);
    transition: transform .2s ease, box-shadow .2s ease;
    opacity:0;
    transform: translateY(14px) scale(.97);
    animation: card-in .5s ease forwards;
  }
  @keyframes card-in{ to{ opacity:1; transform: translateY(0) scale(1);} }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 9px 0 rgba(39,97,72,0.14);
  }
  .card-loc{
    font-family:"Baloo 2",sans-serif;
    font-weight:700;
    font-size: 17px;
    color: var(--leaf-deep);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 12px;
  }
  .card-loc .name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .stock-grid{
    display:grid;
    grid-template-columns: auto 1fr 1fr;
    gap: 6px 10px;
    align-items:center;
  }
  .stock-grid-row{
    display:contents;
  }
  .stock-grid-head span{
    font-size:11.5px;
    font-weight:800;
    color:#7C9686;
    text-align:center;
  }
  .stock-grid-row.dimmed span,
  .stock-grid-row.dimmed .qty-input,
  .stock-grid-row.dimmed .readonly-qty{
    opacity:0.35;
  }
  .color-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-weight:800;
    font-size:12px;
    padding: 4px 10px;
    border-radius: 999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .color-tag.c-white{ background:#fff; color:#7A5A2C; border:2px solid #E3C48F; }
  .color-tag.c-yellow{ background: var(--yellow); color:#6B4A00; }
  .color-tag.c-red{ background: var(--red); color:#fff; }
  .color-tag.c-blue{ background: var(--sky); color:#fff; }

  .badge{
    display:inline-flex;
    align-items:center;
    font-weight:800;
    font-size:11px;
    padding: 3px 9px;
    border-radius: 8px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .badge.badge-main{ background:#FFE1A8; color:#8A5A00; border:1.5px solid #E8B34A; }
  .badge.badge-sub{ background:#E3D4FA; color:#5B3C93; border:1.5px solid #B080E0; }

  .stock-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:#FAF7F0;
    border-radius: 12px;
    padding: 7px 10px;
    margin-bottom: 7px;
  }
  .stock-line:last-child{ margin-bottom:0; }
  .stock-label{
    font-size:12.5px;
    font-weight:700;
    color:#7C9686;
    flex-shrink:0;
  }
  .stock-label.essence{ color: var(--pink-deep); }
  .stock-label.petal{ color: #2C7A93; }

  .qty-input{
    width:70px;
    font-family:"Baloo 2",monospace;
    font-size:15px;
    font-weight:700;
    text-align:center;
    padding: 5px 4px;
    border-radius: 8px;
    border: 2px solid #D9E8DD;
    outline:none;
    color: var(--ink);
    background:#FBFAF6;
  }
  .qty-input:focus{ border-color: var(--leaf);}
  .readonly-qty{
    font-family:"Baloo 2",monospace;
    font-weight:800;
    font-size:15px;
    color: var(--ink);
    text-align:center;
    display:block;
  }

  .empty{
    text-align:center;
    grid-column: 1/-1;
    padding: 50px 20px;
    color:#7C9686;
    font-weight:600;
  }
  .empty .emoji{ font-size:40px; display:block; margin-bottom:10px;}

  /* ---------- analysis ---------- */
  /* ---------- 開花日程日曆 ---------- */
  .cal-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(43,70,54,0.45);
    display:none;
    align-items:center; justify-content:center;
    padding:14px;
  }
  .cal-overlay.open{ display:flex; }
  .cal-modal{
    background:var(--cream);
    border-radius:24px;
    width:100%; max-width:560px;
    max-height:92vh; overflow-y:auto;
    padding:18px 16px 16px;
    box-shadow:0 10px 0 rgba(39,97,72,0.18);
    position:relative;
  }
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:10px;
  }
  .cal-title{
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:19px; color:var(--leaf-deep);
  }
  .cal-nav{ display:flex; gap:6px; align-items:center; }
  .cal-nav button, .cal-close{
    border:none; cursor:pointer;
    font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:13px;
    padding:6px 12px; border-radius:999px;
    background:var(--white); color:var(--leaf-deep);
    box-shadow:0 2px 0 rgba(39,97,72,0.18);
  }
  .cal-close{ background:var(--leaf); color:#fff; box-shadow:0 2px 0 var(--leaf-deep); }
  .cal-week, .cal-days{
    display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px;
  }
  .cal-week span{
    text-align:center; font-size:12px; font-weight:800; color:#7C9686; padding:4px 0;
  }
  .cal-cell{
    min-height:54px; border-radius:10px; background:var(--white);
    padding:4px 3px; font-size:10px; line-height:1.25;
    border:2px solid transparent; cursor:default; overflow:hidden;
    display:flex; flex-direction:column; gap:2px;
  }
  .cal-pad{ min-height:0; }
  .cal-cell.has{ cursor:pointer; }
  .cal-cell.today{ border-color:var(--leaf); }
  .cal-cell.selected{ border-color:var(--purple); }
  .cal-day{ font-weight:800; font-size:11px; color:var(--ink); }
  .cal-flower{
    border-radius:6px; padding:2px 3px; font-weight:700; word-break:break-all;
  }
  .cal-flower.ok{ background:#E4F3E9; color:var(--leaf-deep); }
  .cal-flower.low{ background:#FFE3C2; color:#9A5200; }
  .cal-flower.unknown{ background:#EFEBE0; color:#7C6F55; }
  .cal-legend{
    display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 6px;
    font-size:11.5px; font-weight:700; color:#5C7B6A;
  }
  .cal-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .cal-detail{
    background:var(--white); border-radius:16px; padding:12px 14px; margin-top:8px;
    font-size:13px; line-height:1.7;
  }
  .cal-detail h4{ margin:0 0 6px; font-size:14px; color:var(--leaf-deep); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cal-detail .reset{
    border:none; background:#EFEBE0; color:#7C6F55; border-radius:999px;
    font-family:inherit; font-weight:700; font-size:11.5px; padding:3px 10px; cursor:pointer;
  }
  .cal-item{ padding:6px 0; border-top:1px dashed #E3D9C4; }
  .cal-item:first-of-type{ border-top:none; }
  .cal-item .tag-low{ color:#B35E00; font-weight:800; }
  .cal-item .tag-ok{ color:var(--leaf-deep); font-weight:800; }

  .analysis-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .analysis-card{
    background: var(--white);
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: var(--card-shadow);
    border: 3px solid rgba(39,97,72,0.06);
  }
  .analysis-card h3{
    margin: 0 0 12px;
    font-family:"Baloo 2",sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--leaf-deep);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .rank-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .rank-list li{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
  }
  .rank-no{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    background:#EAF3EC;
    color:var(--leaf-deep);
    font-family:"Baloo 2",sans-serif;
    font-weight:800;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }
  .rank-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color: var(--ink);
  }
  .rank-qty{
    font-family:"Baloo 2",monospace;
    font-weight:800;
    color:#5C7B6A;
    flex-shrink:0;
  }

  footer.credit{
    text-align:center;
    margin-top: 46px;
    font-size:12px;
    color:#9AA88E;
    line-height:1.7;
  }

  @media (max-width:520px){
    .filter-bar{ gap:8px;}
    .chip{ padding:7px 14px; font-size:13px;}
  }
</style>
</head>
<body>

<!-- ---------- back to index ---------- -->
<a href="index.html" style="
  position:fixed; top:16px; left:16px; z-index:200;
  display:inline-flex; align-items:center; gap:6px;
  background:#3E9166; color:#fff; text-decoration:none;
  font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif; font-weight:700; font-size:13.5px;
  padding:9px 16px; border-radius:999px; box-shadow:0 3px 0 #276148;

" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">← 回首頁</a>

<span class="drift d1">🍃</span>
<span class="drift d2">🌱</span>
<span class="drift d3">🍃</span>
<span class="drift d4">🌱</span>
<span class="drift d5">🍃</span>

<div class="wrap">

  <div class="bloom-strip" aria-hidden="true">
    <span>🌸</span><span>🌼</span><span>🌷</span><span>🌺</span><span>🌻</span><span>🌹</span><span>💮</span>
  </div>

  <header>
    <h1>花田庫存 精華・花瓣</h1>
    <p class="sub">皮克敏花田物資紀錄 🌱</p>
    <div class="status-row">
      <div class="update-pill">
        <span id="updateTime">尚未讀取</span>

  </header>

  <!-- ---------- 總覽（唯讀，依顏色加總） ---------- -->
  <div class="overview" id="overviewGrid"></div>

  <!-- ---------- 花種庫存 ---------- -->
  <h2 class="section-title">🌸 花種庫存明細 <span class="count-hint" id="speciesCountHint"></span></h2>
  <div id="bulkToggleWrap" style="display:none; text-align:center; margin-bottom:14px;">

    <div style="display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap;">
      <button id="bulkApplyBtn" type="button" style="border:none; cursor:pointer; background:var(--leaf); color:#fff; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13.5px; padding:9px 20px; border-radius:999px; box-shadow:0 3px 0 var(--leaf-deep);">✅ 套用</button>
      <button id="bulkCancelBtn" type="button" style="border:none; cursor:pointer; background:#EFEBE0; color:#7C6F55; font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:13.5px; padding:9px 20px; border-radius:999px;">取消</button>

    新增花種請直接在 Google 試算表「庫存」工作表新增一列即可

<button id="jumpToAnalysisBtn" type="button" title="庫存分析" aria-label="庫存分析" style="

<button id="openCalendarBtn" type="button" title="開花日程" aria-label="開花日程" style="
  position:fixed; right:18px; bottom:78px; z-index:200;
  width:50px; height:50px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:#3E9166; color:#fff; border:none; cursor:pointer;
  font-size:22px; line-height:1; border-radius:50%; box-shadow:0 4px 0 #276148;
  transition:transform .15s ease;
" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">📅</button>

<div class="cal-overlay" id="calOverlay">
  <div class="cal-modal" role="dialog" aria-label="強開團開花日程">
    <div class="cal-head">
      <span class="cal-title" id="calTitle">開花日程</span>

        <button type="button" id="calToday">今天</button>

      </div>

    <div class="cal-days" id="calDays"></div>
    <div class="cal-legend">
      <span><i style="background:#FFE3C2"></i>庫存偏低（精華＋花瓣＜2000），建議先補</span>
      <span><i style="background:#E4F3E9"></i>庫存足夠</span>
      <span><i style="background:#EFEBE0"></i>庫存表找不到該花</span>
    </div>
    <div class="cal-detail" id="calDetail"></div>
  </div>
</div>

<script>
  /* =====================================================================
     【設定區】
     1) API_URL：部署好 Google Apps Script 後，把「網頁應用程式網址」貼在這裡
        格式類似：https://script.google.com/macros/s/AKfycb.../exec
     2) GOOGLE_CLIENT_ID：Google Cloud Console 的 OAuth 用戶端 ID，
        必須跟 Code.gs 裡的 OAUTH_CLIENT_ID 完全一致，管理員才能登入。
  ===================================================================== */
  const API_URL = "https://script.google.com/macros/s/AKfycbyO8sgzMMDGOcEb54gA26qpcQDPcjZ_4xIjpCFQOBJsucypsc1wcpyOMhBDrVuRl6xZ/exec";
  const GOOGLE_CLIENT_ID = "1001037373208-3sdt3t6aekf1v0efidd53ob62m92t2nl.apps.googleusercontent.com";

  const COLOR_ORDER = ["白", "黃", "紅", "藍"];
  const COLOR_META = {
    "白": { cls: "c-white", emoji: "🤍" },
    "黃": { cls: "c-yellow", emoji: "💛" },
    "紅": { cls: "c-red",   emoji: "❤️" },
    "藍": { cls: "c-blue",  emoji: "💙" },
  };

  // 目前的花種清單（僅本地示範模式／尚未接後端時使用）
  const SPECIES_LIST = [
    ["普花","WYRB"], ["洋桔梗","WYRB"], ["雞冠花","WYRB"], ["銀蓮花","WYRB"],
    ["風鈴草","WRB"], ["九重葛","WYRB"], ["海芋","WYRB"], ["山茶花","WYRB"],
    ["美人蕉","WYR"], ["油菜花","WYB"], ["康乃馨","WYRB"], ["嘉德麗雅蘭","WYRB"],
    ["櫻花","W"], ["菊花","WYRB"], ["鐵線蓮","WYRB"], ["彼岸花","WYR"],
    ["鈴蘭","WR"], ["大波斯菊","WYR"], ["兔耳花","WRB"], ["大理花","WYRB"],
    ["石竹","WRB"], ["曇花","WYRB"], ["勿忘草","WYRB"], ["小蒼蘭","WYRB"],
    ["龍膽","WRB"], ["聖誕玫瑰","WYRB"], ["扶桑花","WYRB"], ["風信子","WYRB"],
    ["繡球花","WRB"], ["鳶尾花","WYRB"], ["百合","WYR"], ["萬壽菊","WYR"],
    ["牽牛花","WYRB"], ["蝴蝶蘭","WYRB"], ["水仙花","WY"], ["粉蝶花","B"],
    ["睡蓮","WYRB"], ["三色菫","WYRB"], ["牡丹","WYRB"], ["矮牽牛","WYRB"],
    ["梅花","WYR"], ["雞蛋花","WYR"], ["聖誕紅","WYRB"], ["櫻草花","WYRB"],
    ["玫瑰","WYRB"], ["週年紀念玫瑰","WYRB"], ["鼠尾草","WYRB"], ["金魚草","WYRB"],
    ["雪花蓮","WYR"], ["天堂鳥","WYR"], ["向日葵","Y"], ["豌豆花","WYRB"],
    ["鬱金香","WYRB"], ["鸚鵡鬱金香","WYRB"],
  ];
  const CODE_TO_COLOR = { W:"白", Y:"黃", R:"紅", B:"藍" };

  function buildFallback(){
    const list = [];
    SPECIES_LIST.forEach(([name, codes], idx) => {
      const order = idx + 1;
      codes.split('').forEach(code => {
        list.push({ species: name, color: CODE_TO_COLOR[code], essence: 0, petal: 0, order });
      });
    });
    return list;
  }

  let items = [];        // [{species, color, essence, petal}] —— 依試算表原始順序
  let speciesCount = 0;
  let specialEssence = 0;
  let lastUpdated = '';
  let schedule = [];     // [{date:'2026-10-15', species, color, note}] —— 來自「開花日程」工作表

  let isAdmin = false;
  let idToken = null;
  let adminEmail = null;
  let adminName = null;

  let activeColor = "全部";
  let searchTerm = "";
  let sortMode = "default";

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function setSyncStatus(state, text){
    const pill = document.getElementById('syncPill');
    const label = document.getElementById('syncText');
    if(!pill || !label) return;
    pill.className = 'sync-pill' + (state ? ' ' + state : '');
    label.textContent = text;
  }

  /* ---------------- 讀取資料 ---------------- */
  async function loadData(){
    if(!API_URL){
      items = buildFallback();
      afterLoad();
      setSyncStatus('error', '💻 本地示範模式，未連接試算表');
      return;
    }
    setSyncStatus('syncing', '🔄 同步中…');
    try{
      const res = await fetch(`${API_URL}?action=list`);
      const data = await res.json();
      if(data.ok){
        items = data.items;
        specialEssence = data.specialEssence || 0;
        lastUpdated = data.lastUpdated || '';
        schedule = data.schedule || [];
        afterLoad();
        const now2 = new Date();
        const hh2 = String(now2.getHours()).padStart(2,'0');
        const mm2 = String(now2.getMinutes()).padStart(2,'0');
        setSyncStatus('synced', `✅ 已同步（${hh2}:${mm2}）`);
      } else {
        afterLoad();
        setSyncStatus('error', '⚠️ 連線失敗，顯示可能不是最新資料');
      }
    } catch(err){
      console.error('讀取庫存失敗', err);
      setSyncStatus('error', '⚠️ 連線失敗，顯示可能不是最新資料');
    }
  }

  function afterLoad(){
    const seen = new Set();
    items.forEach(p => seen.add(p.species));
    speciesCount = seen.size;

    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('updateTime').textContent = `更新於 今天 ${hh}:${mm}`;

    const lastUpdatedEl = document.getElementById('lastUpdatedText');
    if(lastUpdatedEl){
      lastUpdatedEl.textContent = lastUpdated ? `🕒 庫存最後異動：${lastUpdated}` : '🕒 庫存最後異動：尚無紀錄';
    }

    renderOverview();
    renderColorChips();
    renderGrid();
    renderAnalysis();
    if(calOpen) renderCalendar();
  }

  /* ---------- 開花日程日曆 ---------- */
  const LOW_STOCK_THRESHOLD = 2000;   // 精華＋花瓣 低於這個數字就提醒補庫存
  let calOpen = false;
  let calYear, calMonth;              // calMonth: 0-11
  let calSelected = null;             // 'yyyy-mm-dd' 或 null（顯示近期提醒）

  function todayStr(){
    // 以台灣時間（UTC+8）為準
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
  }
  function pad2(n){ return String(n).padStart(2, '0'); }

  function stockOf(entry){
    const item = items.find(i => i.species === entry.species && i.color === entry.color);
    if(!item) return { found:false };
    const total = item.essence + item.petal;
    return { found:true, essence:item.essence, petal:item.petal, total, low: total < LOW_STOCK_THRESHOLD };
  }
  function stockClass(entry){
    const s = stockOf(entry);
    return !s.found ? 'unknown' : (s.low ? 'low' : 'ok');
  }

  function scheduleOn(dateStr){
    return schedule.filter(s => s.date === dateStr);
  }

  function renderCalendar(){
    const first = new Date(calYear, calMonth, 1);
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const startDow = first.getDay();
    const today = todayStr();

    document.getElementById('calTitle').textContent = `📅 ${calYear} 年 ${calMonth + 1} 月`;

    let html = '';
    for(let i = 0; i < startDow; i++) html += `<div class="cal-pad"></div>`;
    for(let d = 1; d <= daysInMonth; d++){
      const ds = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
      const entries = scheduleOn(ds);
      const cls = ['cal-cell'];
      if(entries.length) cls.push('has');
      if(ds === today) cls.push('today');
      if(ds === calSelected) cls.push('selected');
      const flowers = entries.map(e =>
        `<span class="cal-flower ${stockClass(e)}">${escapeHtml(e.species)}</span>`
      ).join('');
      html += `<div class="${cls.join(' ')}" data-date="${ds}"><span class="cal-day">${d}</span>${flowers}</div>`;
    }
    const daysEl = document.getElementById('calDays');
    daysEl.innerHTML = html;
    daysEl.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', () => {
        calSelected = cell.dataset.date;
        renderCalendar();
      });
    });

    renderCalendarDetail();
  }

  function entryHtml(e, showDate){
    const s = stockOf(e);
    const colorEmoji = (COLOR_META[e.color] || {}).emoji || '';
    const head = `${showDate ? escapeHtml(e.date.slice(5)) + '　' : ''}<b>${escapeHtml(e.species)}</b>（${colorEmoji}${escapeHtml(e.color)}）`;
    let stock;
    if(!s.found){
      stock = `<span style="color:#A6947A;">庫存表找不到這個花種／顏色</span>`;
    } else if(s.low){
      stock = `✨${s.essence}／🌸${s.petal}　共${s.total}　<span class="tag-low">庫存偏低，建議當天先補</span>`;
    } else {
      stock = `✨${s.essence}／🌸${s.petal}　共${s.total}　<span class="tag-ok">庫存足夠</span>`;
    }
    const note = e.note ? `<div style="color:#7C6F55;">備註：${escapeHtml(e.note)}</div>` : '';
    return `<div class="cal-item">${head}<div>${stock}</div>${note}</div>`;
  }

  function renderCalendarDetail(){
    const box = document.getElementById('calDetail');
    if(calSelected){
      const entries = scheduleOn(calSelected);
      box.innerHTML = `
        <h4><span>${escapeHtml(calSelected)}</span><button class="reset" type="button" id="calResetBtn">看近期提醒</button></h4>
        ${entries.length ? entries.map(e => entryHtml(e, false)).join('') : '<div style="color:#A6947A;">這天沒有排開花日程</div>'}
      `;
      document.getElementById('calResetBtn').addEventListener('click', () => {
        calSelected = null;
        renderCalendar();
      });
      return;
    }

    // 近期提醒：今天起 7 天內
    const today = todayStr();
    const end = new Date(today + 'T00:00:00');
    end.setDate(end.getDate() + 6);
    const endStr = `${end.getFullYear()}-${pad2(end.getMonth() + 1)}-${pad2(end.getDate())}`;
    const upcoming = schedule
      .filter(s => s.date >= today && s.date <= endStr)
      .sort((a, b) => a.date.localeCompare(b.date));

    box.innerHTML = `
      <h4><span>近 7 天開花提醒</span></h4>
      ${upcoming.length
        ? upcoming.map(e => entryHtml(e, true)).join('')
        : '<div style="color:#A6947A;">近 7 天沒有排開花日程（日程請填在試算表「開花日程」工作表）</div>'}
    `;
  }

  function openCalendar(){
    const t = todayStr();
    calYear = Number(t.slice(0, 4));
    calMonth = Number(t.slice(5, 7)) - 1;
    calSelected = null;
    calOpen = true;
    document.getElementById('calOverlay').classList.add('open');
    renderCalendar();
  }
  function closeCalendar(){
    calOpen = false;
    document.getElementById('calOverlay').classList.remove('open');
  }

  /* ---------- 庫存分析：精華 / 花瓣 最高最低前五名 ---------- */
  function rankListHtml(list){
    if(list.length === 0) return `<li style="color:#A6947A;">目前沒有資料</li>`;
    return list.map((item, i) => {
      const meta = COLOR_META[item.color];
      return `
        <li>
          <span class="rank-no">${i + 1}</span>
          <span class="color-tag ${meta.cls}" style="padding:2px 8px;font-size:10.5px;">${meta.emoji}</span>
          <span class="rank-name">${escapeHtml(item.species)}</span>
          <span class="rank-qty">${item[list.field]}</span>
        </li>
      `;
    }).join("");
  }

  function topN(field, order, n){
    const sorted = items.slice().sort((a, b) => order === 'desc' ? b[field] - a[field] : a[field] - b[field]);
    const top = sorted.slice(0, n);
    top.field = field;
    return top;
  }

  // 精華還有蠻多、但花瓣很少的花種 —— 建議優先去補花瓣
  function topRestockPetal(n){
    const sorted = items.slice().sort((a, b) => (b.essence - b.petal) - (a.essence - a.petal));
    return sorted.slice(0, n);
  }

  // 精華＋花瓣總量小於 2000 的花種 —— 建議優先補倉，總量最少的排最前面
  function topLowStock(n, threshold){
    const low = items.filter(i => (i.essence + i.petal) < threshold);
    low.sort((a, b) => (a.essence + a.petal) - (b.essence + b.petal));
    return low.slice(0, n);
  }

  function restockListHtml(list){
    if(list.length === 0) return `<li style="color:#A6947A;">目前沒有資料</li>`;
    return list.map((item, i) => {
      const meta = COLOR_META[item.color];
      return `
        <li>
          <span class="rank-no">${i + 1}</span>
          <span class="color-tag ${meta.cls}" style="padding:2px 8px;font-size:10.5px;">${meta.emoji}</span>
          <span class="rank-name">${escapeHtml(item.species)}</span>
          <span class="rank-qty">✨${item.essence}／🌸${item.petal}</span>
        </li>
      `;
    }).join("");
  }

  function lowStockListHtml(list){
    if(list.length === 0) return `<li style="color:#A6947A;">沒有低於門檻的花種</li>`;
    return list.map((item, i) => {
      const meta = COLOR_META[item.color];
      const total = item.essence + item.petal;
      return `
        <li>
          <span class="rank-no">${i + 1}</span>
          <span class="color-tag ${meta.cls}" style="padding:2px 8px;font-size:10.5px;">${meta.emoji}</span>
          <span class="rank-name">${escapeHtml(item.species)}</span>
          <span class="rank-qty">共${total}</span>
        </li>
      `;
    }).join("");
  }

  function renderAnalysis(){
    const wrap = document.getElementById('analysisGrid');
    if(!wrap) return;
    if(items.length === 0){ wrap.innerHTML = ''; return; }

    const cards = [
      { title: '✨ 精華庫存最低 Top 5', field: 'essence', order: 'asc' },
      { title: '🌸 花瓣庫存最低 Top 5', field: 'petal', order: 'asc' },
    ];

    let html = cards.map(c => {
      const list = topN(c.field, c.order, 5);
      return `
        <div class="analysis-card">
          <h3>${c.title}</h3>
          <ul class="rank-list">${rankListHtml(list)}</ul>
        </div>
      `;
    }).join("");

    html += `
      <div class="analysis-card">
        <h3>🧺 建議快補花瓣 Top 5</h3>
        <ul class="rank-list">${restockListHtml(topRestockPetal(5))}</ul>
      </div>
    `;

    html += `
      <div class="analysis-card">
        <h3>📦 補倉建議 Top 5（精華＋花瓣＜2000）</h3>
        <ul class="rank-list">${lowStockListHtml(topLowStock(5, 2000))}</ul>
      </div>
    `;

    wrap.innerHTML = html;
  }

  /* ---------------- 總覽（唯讀加總 + 特殊精華） ---------------- */
  function renderOverview(){
    const wrap = document.getElementById('overviewGrid');
    wrap.innerHTML = "";
    COLOR_ORDER.forEach(color => {
      const rows = items.filter(i => i.color === color);
      const essenceSum = rows.reduce((s, i) => s + (i.essence || 0), 0);
      const petalSum = rows.reduce((s, i) => s + (i.petal || 0), 0);
      const meta = COLOR_META[color];
      const card = document.createElement('div');
      card.className = 'overview-card';
      card.innerHTML = `
        <span class="tag color-tag ${meta.cls}">${meta.emoji} ${color}</span>
        <div class="nums">
          <span>✨ ${essenceSum}</span>
          <span>🌸 ${petalSum}</span>
        </div>
      `;
      wrap.appendChild(card);
    });

    // 特殊精華：沒有花色、沒有花瓣，只有一個精華數字
    const specialCard = document.createElement('div');
    specialCard.className = 'overview-card';
    const specialControl = isAdmin
      ? `<input type="number" class="qty-input" min="0" value="${specialEssence}" id="specialEssenceInput" style="width:80px;" />`
      : `<span class="readonly-qty">${specialEssence}</span>`;
    specialCard.innerHTML = `
      <span class="tag" style="background:#FDEBF1; color:#B5406B; border:1.5px solid #F2A9C4;">💖 特殊精華</span>
      <div class="nums">${specialControl}</div>
    `;
    wrap.appendChild(specialCard);

    if(isAdmin){
      const input = document.getElementById('specialEssenceInput');
      if(input){
        input.addEventListener('change', () => {
          const qty = Math.max(0, Math.floor(Number(input.value) || 0));
          updateSpecialEssence(qty);
        });
      }
    }
  }

  async function updateSpecialEssence(qty){
    if(!isAdmin) return;
    if(!API_URL){
      specialEssence = qty;
      renderOverview();
      return;
    }
    try{
      const params = new URLSearchParams({ action: 'updateSpecial', qty, idToken });
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const data = await res.json();
      if(!data.ok){ alert('更新失敗：' + (data.error || '未知錯誤')); await loadData(); return; }
      specialEssence = data.qty;
      renderOverview();
    } catch(err){
      alert('連線失敗，請檢查網路連線');
    }
  }

  /* ---------------- 花色篩選 chips ---------------- */
  function renderColorChips(){
    const bar = document.getElementById('colorFilterBar');
    bar.innerHTML = "";
    const options = [{ key: "全部", emoji: "🌈" }, ...COLOR_ORDER.map(c => ({ key: c, emoji: COLOR_META[c].emoji }))];
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (opt.key === activeColor ? ' active' : '');
      btn.type = 'button';
      btn.innerHTML = `${opt.emoji} ${opt.key}`;
      btn.addEventListener('click', () => { activeColor = opt.key; renderColorChips(); renderGrid(); });
      bar.appendChild(btn);
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    renderGrid();
  });

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    sortMode = e.target.value;
    renderGrid();
  });

  /* ---------------- 排序（sortSpecies 定義在下方，依花種彙總排序） ---------------- */

  /* ---------------- 花種卡片（一張卡 = 一個花種，內含所有花色） ---------------- */
  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = "";

    const seen = new Set();
    let speciesList = [];
    items.forEach(i => { if(!seen.has(i.species)){ seen.add(i.species); speciesList.push(i.species); } });

    speciesList = speciesList.filter(name => {
      if(searchTerm && !name.includes(searchTerm)) return false;
      if(activeColor !== "全部"){
        const has = items.some(i => i.species === name && i.color === activeColor);
        if(!has) return false;
      }
      return true;
    });

    speciesList = sortSpecies(speciesList);

    document.getElementById('speciesCountHint').textContent = `共 ${speciesList.length} 種花`;

    if(speciesList.length === 0){
      grid.innerHTML = `<div class="empty"><span class="emoji">🌱</span>找不到符合條件的花種，換個篩選或關鍵字看看吧。</div>`;
      return;
    }

    speciesList.forEach((name, i) => grid.appendChild(createSpeciesCard(name, i)));
  }

  function sortSpecies(speciesList){
    const stat = name => {
      const rows = items.filter(i => i.species === name);
      if(activeColor === "全部"){
        return {
          essence: rows.reduce((s, r) => s + (r.essence || 0), 0),
          petal: rows.reduce((s, r) => s + (r.petal || 0), 0),
          order: Math.min(...rows.map(r => r.order || 0)),
        };
      }
      const row = rows.find(r => r.color === activeColor);
      return {
        essence: row ? row.essence : 0,
        petal: row ? row.petal : 0,
        order: Math.min(...rows.map(r => r.order || 0)),
      };
    };
    const sorted = speciesList.slice();
    if(sortMode === "default") sorted.sort((a,b) => stat(a).order - stat(b).order);
    else if(sortMode === "essence-asc") sorted.sort((a,b) => stat(a).essence - stat(b).essence);
    else if(sortMode === "essence-desc") sorted.sort((a,b) => stat(b).essence - stat(a).essence);
    else if(sortMode === "petal-asc") sorted.sort((a,b) => stat(a).petal - stat(b).petal);
    else if(sortMode === "petal-desc") sorted.sort((a,b) => stat(b).petal - stat(a).petal);
    return sorted;
  }

  function qtyFieldHtml(item, field){
    const value = item[field];
    if(!isAdmin){
      return `<span class="readonly-qty">${value}</span>`;
    }
    return `<input type="number" class="qty-input" min="0" value="${value}" data-species="${escapeHtml(item.species)}" data-color="${item.color}" data-field="${field}" />`;
  }

  function createSpeciesCard(name, i){
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = Math.min(i * 0.03, 0.4) + 's';

    const rows = items.filter(p => p.species === name);
    const orderVal = Math.min(...rows.map(r => r.order || 0));
    const badgeHtml = orderVal === 2
      ? `<span class="badge badge-main">主花</span>`
      : orderVal === 3
        ? `<span class="badge badge-sub">副花</span>`
        : '';

    const rowsHtml = COLOR_ORDER
      .map(color => rows.find(r => r.color === color))
      .filter(Boolean)
      .map(item => {
        const meta = COLOR_META[item.color];
        const dimmed = (activeColor !== "全部" && activeColor !== item.color) ? ' dimmed' : '';
        return `
          <div class="stock-grid-row${dimmed}">
            <span class="color-tag ${meta.cls}">${meta.emoji} ${item.color}</span>
            ${qtyFieldHtml(item, 'essence')}
            ${qtyFieldHtml(item, 'petal')}
          </div>
        `;
      }).join("");

    card.innerHTML = `
      <div class="card-loc">
        <span class="name">🌼 ${escapeHtml(name)}</span>
        ${badgeHtml}
      </div>
      <div class="stock-grid">
        <div class="stock-grid-row stock-grid-head">
          <span></span><span>精華</span><span>花瓣</span>
        </div>
        ${rowsHtml}
      </div>
    `;

    card.querySelectorAll('.qty-input').forEach(input => {
      input.addEventListener('change', () => {
        const qty = Math.max(0, Math.floor(Number(input.value) || 0));
        updateQty(input.dataset.species, input.dataset.color, input.dataset.field, qty);
      });
    });

    return card;
  }

  async function updateQty(species, color, field, qty){
    if(!isAdmin) return;
    if(!API_URL){
      const item = items.find(i => i.species === species && i.color === color);
      if(item) item[field] = qty;
      renderOverview();
      renderGrid();
      renderAnalysis();
      return;
    }
    try{
      const params = new URLSearchParams({ action: 'update', species, color, field, qty, idToken });
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const data = await res.json();
      if(!data.ok){ alert('更新失敗：' + (data.error || '未知錯誤')); await loadData(); return; }
      const item = items.find(i => i.species === species && i.color === color);
      if(item) item[field] = data.qty;
      renderOverview();
      renderGrid();
      renderAnalysis();
    } catch(err){
      alert('連線失敗，請檢查網路連線');
    }
  }

  /* ---------------- 管理員登入（Google 帳號） ---------------- */
  const adminPill = document.getElementById('adminPill');
  const adminStatusText = document.getElementById('adminStatusText');
  const logoutBtn = document.getElementById('logoutBtn');
  const googleBtnContainer = document.getElementById('googleSignInBtn');

  function refreshAdminPill(){
    if(isAdmin){
      adminPill.classList.add('is-admin');
      adminStatusText.textContent = `🔓 管理員（${adminName || adminEmail || ''}）`;
      googleBtnContainer.style.display = 'none';
      logoutBtn.style.display = 'inline-flex';
    } else {
      adminPill.classList.remove('is-admin');
      adminStatusText.textContent = '🔒 訪客模式（僅檢視）';
      googleBtnContainer.style.display = '';
      logoutBtn.style.display = 'none';
    }
    const bulkToggleWrap = document.getElementById('bulkToggleWrap');
    if(bulkToggleWrap) bulkToggleWrap.style.display = isAdmin ? '' : 'none';
    if(!isAdmin){
      const bulkPanel = document.getElementById('bulkPanel');
      if(bulkPanel) bulkPanel.style.display = 'none';
    }
  }

  function decodeJwtPayload(token){
    try{
      const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      const json = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(json);
    } catch(err){ return null; }
  }

  async function handleGoogleCredential(response){
    const token = response.credential;

    if(!API_URL){
      const payload = decodeJwtPayload(token);
      alert('尚未設定後端網址（API_URL），目前為本地示範模式，先讓你預覽管理員畫面。\n部署好 Apps Script 後，才會是真正安全的登入驗證。');
      isAdmin = true;
      idToken = token;
      adminEmail = payload && payload.email ? payload.email : '示範模式';
      adminName = payload && payload.name ? payload.name : adminEmail;
      refreshAdminPill();
      renderGrid();
      return;
    }

    try{
      const res = await fetch(`${API_URL}?action=login&idToken=${encodeURIComponent(token)}`);
      const data = await res.json();
      if(data.ok){
        isAdmin = true;
        idToken = token;
        adminEmail = data.email;
        adminName = data.name || data.email;
        refreshAdminPill();
        renderGrid();
      } else {
        alert('登入失敗：' + (data.error || '此帳號沒有管理員權限'));
      }
    } catch(err){
      alert('登入驗證失敗，請檢查網路連線');
    }
  }

  function initGoogleSignIn(){
    if(!GOOGLE_CLIENT_ID){
      googleBtnContainer.innerHTML = '<span style="font-size:11px;color:#A6947A;">尚未設定 Google 登入</span>';
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
    });
    google.accounts.id.renderButton(googleBtnContainer, {
      theme: 'outline', size: 'medium', shape: 'pill', text: 'signin_with',
    });
  }

  function waitForGoogleAndInit(retriesLeft){
    if(retriesLeft === undefined) retriesLeft = 20;
    if(window.google && window.google.accounts && window.google.accounts.id){
      initGoogleSignIn();
      return;
    }
    if(retriesLeft <= 0){
      googleBtnContainer.innerHTML = '<span style="font-size:11px;color:#A6947A;">Google 登入元件載入失敗，請檢查網路連線後重新整理</span>';
      return;
    }
    setTimeout(() => waitForGoogleAndInit(retriesLeft - 1), 250);
  }

  logoutBtn.addEventListener('click', () => {
    isAdmin = false;
    idToken = null;
    adminEmail = null;
    adminName = null;
    if(window.google && window.google.accounts){
      google.accounts.id.disableAutoSelect();
    }
    refreshAdminPill();
    renderGrid();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadData);
  document.getElementById('jumpToAnalysisBtn').addEventListener('click', () => {
    document.getElementById('analysisSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ---------------- 開花日程日曆：按鈕事件 ---------------- */
  document.getElementById('openCalendarBtn').addEventListener('click', openCalendar);
  document.getElementById('calClose').addEventListener('click', closeCalendar);
  document.getElementById('calOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'calOverlay') closeCalendar();   // 點背景關閉
  });
  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById('calToday').addEventListener('click', () => {
    const t = todayStr();
    calYear = Number(t.slice(0, 4));
    calMonth = Number(t.slice(5, 7)) - 1;
    calSelected = null;
    renderCalendar();
  });

  /* ---------------- 批次貼上（截圖辨識結果） ---------------- */
  const bulkToggleBtn = document.getElementById('bulkToggleBtn');
  const bulkPanel = document.getElementById('bulkPanel');
  const bulkTextarea = document.getElementById('bulkTextarea');
  const bulkResult = document.getElementById('bulkResult');

  if(bulkToggleBtn){
    bulkToggleBtn.addEventListener('click', () => {
      bulkPanel.style.display = bulkPanel.style.display === 'none' ? '' : 'none';
      bulkResult.textContent = '';
    });
  }
  const bulkCancelBtn = document.getElementById('bulkCancelBtn');
  if(bulkCancelBtn){
    bulkCancelBtn.addEventListener('click', () => {
      bulkPanel.style.display = 'none';
      bulkTextarea.value = '';
      bulkResult.textContent = '';
    });
  }

  function parseBulkText(text){
    const rows = [];
    const errors = [];
    text.split('\n').forEach(rawLine => {
      const line = rawLine.trim();
      if(!line) return;
      const parts = line.split(/[,\t，]/).map(s => s.trim()).filter(s => s !== '');
      if(parts.length < 2){ errors.push(line); return; }

      const fullName = parts[0];
      const colorChar = fullName.charAt(0);
      if(!COLOR_ORDER.includes(colorChar)){ errors.push(line); return; }
      const species = fullName.slice(1);

      // 支援兩種欄位順序：精華在前或花瓣在前，用欄位數判斷；預設「精華,花瓣」
      const essence = parts[1] !== undefined && parts[1] !== '' ? Number(parts[1]) : undefined;
      const petal = parts[2] !== undefined && parts[2] !== '' ? Number(parts[2]) : undefined;

      if((essence !== undefined && isNaN(essence)) || (petal !== undefined && isNaN(petal))){
        errors.push(line); return;
      }
      rows.push({ species, color: colorChar, essence, petal });
    });
    return { rows, errors };
  }

  const bulkApplyBtn = document.getElementById('bulkApplyBtn');
  if(bulkApplyBtn){
    bulkApplyBtn.addEventListener('click', async () => {
      if(!isAdmin) return;
      const { rows, errors } = parseBulkText(bulkTextarea.value);
      if(rows.length === 0){
        bulkResult.textContent = '⚠️ 沒有解析到任何資料，請確認格式是「顏色花種,精華,花瓣」';
        return;
      }
      bulkApplyBtn.disabled = true;
      bulkResult.textContent = `⏳ 套用中…（共 ${rows.length} 筆）`;

      if(!API_URL){
        rows.forEach(r => {
          const item = items.find(i => i.species === r.species && i.color === r.color);
          if(item){
            if(r.essence !== undefined) item.essence = Math.max(0, Math.floor(r.essence));
            if(r.petal !== undefined) item.petal = Math.max(0, Math.floor(r.petal));
          }
        });
        renderOverview(); renderGrid(); renderAnalysis();
        bulkResult.textContent = `✅ 本地示範模式已套用 ${rows.length} 筆（未連接試算表，重新整理會消失）`;
        bulkApplyBtn.disabled = false;
        return;
      }

      try{
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'bulkUpdate', idToken, rows }),
        });
        const data = await res.json();
        if(!data.ok){
          bulkResult.textContent = '❌ 套用失敗：' + (data.error || '未知錯誤');
        } else {
          let msg = `✅ 已更新 ${data.updated} 筆`;
          if(data.notFound && data.notFound.length > 0){
            msg += `，找不到 ${data.notFound.length} 筆：${data.notFound.slice(0,5).join('、')}${data.notFound.length > 5 ? ' …' : ''}`;
          }
          if(errors.length > 0){
            msg += `（另有 ${errors.length} 行格式看不懂，已略過）`;
          }
          bulkResult.textContent = msg;
          await loadData();
        }
      } catch(err){
        bulkResult.textContent = '❌ 連線失敗，請檢查網路連線後再試一次';
      }
      bulkApplyBtn.disabled = false;
    });
  }

  refreshAdminPill();
  waitForGoogleAndInit();
  loadData();

  const backendHintEl = document.getElementById('backendHint');
  backendHintEl.textContent = API_URL
    ? '🌐 已連接雲端資料庫'
    : '💻 尚未設定後端網址，目前為本地示範模式（資料僅存在你自己的瀏覽器）';

  if(API_URL){
    setInterval(loadData, 20000);
  }
</script>

</body>
</html>
